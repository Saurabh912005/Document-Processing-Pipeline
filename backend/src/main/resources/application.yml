spring:
  application:
    name: document-processing
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/document_processing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:dpp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:dpp_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

document:
  storage:
    path: ${DOCUMENT_STORAGE_PATH:./storage/documents}

processing:
  max-attempts: 3
  backoff-seconds:
    - 2
    - 4
    - 8

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
